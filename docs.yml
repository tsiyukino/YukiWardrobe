project: YukiWardrobe
kind: unity-upm-package
language: csharp
description: >
  VPM package: outfit switcher for VRChat avatars. A YukiWardrobe component
  holds the configuration; an NDMF plugin generates the FX layer, parameters,
  and menu at build time by emitting Modular Avatar components.
source:
  - Runtime/
  - Editor/
docs: docs/
tests:
  command: none
  note: >
    Compiles only inside a Unity 2022.3 project with the VRChat Avatars SDK
    (>=3.7), NDMF (>=1.11), Modular Avatar (>=1.12) and the TsiYuki Core,
    Core Animation and Core Menus packages installed. This package has no
    tests of its own; the shared helpers it builds with are tested in the
    TsiYuki Core packages, and changes are checked by comparing the
    generated menu, parameters and FX controller of real avatars.
conventions:
  runtime-deps: [VRChat Avatars SDK 3, NDMF, Modular Avatar, TsiYuki Core, TsiYuki Core Animation, TsiYuki Core Menus]
